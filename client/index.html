<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <input type="text" name="item" placeholder="Nome do item" required>
    <input type="text" name="local" placeholder="Local" required>
    <input type="date" name="dataRegistro" required>
    <input type="number" step="0.01" name="valor" placeholder="Valor do item" required>
    <input type="text" name="patrimonio" placeholder="Número do patrimônio" required>
    <input type="button" value="Enviar">
    <title>Inventario</title>
</head>
<body>
    <header><h1>Inventário</h1></header>
    <main>
        <section>
            <Form action+"http://localhost:3000" method="post">

            </Form>
        </section>
        <section>
            <table border="1">
                <thead>
                    <th>Item</th>
                    <th>Local</th>
                    <th>Data</th>
                    <th>Valor</th>
                    <th>Patrimônio</th>
                </thead>
                <tbody id="tabela">
                    <script>
                        fetch('http://localhost:3000/dados')
                        .then(resp => resp.json())
                        .then(resp =>{
                            resp.forEach(p=>{
                                const linha = document.createElement('tr')
                                linha.innerHTML = `
                                  <td>${p.item}</td>
                                  <td>${p.local}</td>
                                  <td>${p.dataRegistro}</td>
                                  <td>${p.valor}</td>
                                  <td>${p.patrimonio}</td>
                                `
                                tabela.appendChild(linha)
                            })
                        })
                    </script>
                </tbody>
            </table>
        </section>
    </main>
    <footer><h2>By anaalvesss</h2></footer>
</body>
</html>
